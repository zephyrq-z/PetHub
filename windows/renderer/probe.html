<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; img-src 'self' file: data:; media-src 'self' file: data:; script-src 'self' 'unsafe-inline'" />
    <title>PetHub asset probe</title>
  </head>
  <body>
    <script>
      // 隐藏窗口里的解码器：给 PetPack 校验和自定义内容启动读取用。
      // 只收 file:// 路径，不联网。
      const TIMEOUT_MS = 8000;

      function probeAudio(url) {
        return new Promise((resolve) => {
          const audio = new Audio();
          let settled = false;
          const finish = (duration) => {
            if (settled) return;
            settled = true;
            audio.removeAttribute('src');
            resolve(Number.isFinite(duration) ? duration : 0);
          };
          audio.preload = 'metadata';
          audio.onloadedmetadata = () => finish(audio.duration);
          audio.onerror = () => finish(0);
          audio.src = url;
          window.setTimeout(() => finish(audio.duration || 0), TIMEOUT_MS);
        });
      }

      function probeImage(url) {
        return new Promise((resolve) => {
          const img = new Image();
          let settled = false;
          const finish = (width, height) => {
            if (settled) return;
            settled = true;
            resolve({ ok: width > 0 && height > 0, width, height });
          };
          img.onload = () => finish(img.naturalWidth, img.naturalHeight);
          img.onerror = () => finish(0, 0);
          img.src = url;
          window.setTimeout(() => finish(img.naturalWidth || 0, img.naturalHeight || 0), TIMEOUT_MS);
        });
      }

      window.__probe = async (payload) => {
        const images = {};
        const audios = {};
        const jobs = [];
        for (const url of payload.images || []) {
          jobs.push(
            probeImage(url).then((result) => {
              images[url] = result;
            })
          );
        }
        for (const url of payload.audios || []) {
          jobs.push(
            probeAudio(url).then((duration) => {
              audios[url] = { duration };
            })
          );
        }
        await Promise.all(jobs);
        return { images, audios };
      };
    </script>
  </body>
</html>
