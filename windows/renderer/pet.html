<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; img-src 'self' file: data:; media-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>桌宠合集 · PetHub</title>
    <link rel="stylesheet" href="pet.css" />
  </head>
  <body>
    <!-- 语音桌宠：头像 + 字幕 -->
    <div id="audio-root" class="root" hidden>
      <div class="face-wrap"><img id="face" class="face" alt="" draggable="false" /></div>
      <div class="caption"><span id="caption-text"></span></div>
    </div>

    <!-- 果冻：一个 Q 弹标志，没有语音 -->
    <div id="jelly-root" class="root" hidden>
      <img id="jelly-icon" class="jelly-icon" alt="果冻" draggable="false" />
    </div>

    </div>

    <script src="pet.js"></script>

</html>
